<!DOCTYPE html>
<html>
<head>
    <title>Smart Quiz App</title>
    <link rel="stylesheet" href="smart.css">
</head>
<body>

<div class="quiz-container">
    <h1>Smart Quiz App</h1>

    <h2 id="question">Question Here</h2>

    <div class="options">
        <button class="option" onclick="checkAnswer(0)"></button>
        <button class="option" onclick="checkAnswer(1)"></button>
        <button class="option" onclick="checkAnswer(2)"></button>
        <button class="option" onclick="checkAnswer(3)"></button>
    </div>

    <p id="score">Score: 0</p>
</div>

<script src="smart.js"></script>

</body>
</html>
